# Manual release button — one run ships all three packages in lockstep.
#
# Bump packages/client/package.json in a PR first (the single source of truth),
# merge to main, then run this workflow from main. It:
#   1. reads the version from package.json
#   2. fails if that tag already exists
#   3. npm publish (Trusted Publishing / OIDC, no token) -> @tbtop/inertia-admin,
#      then packages/node -> @tbtop/admin (same version, checked)
#   4. creates and pushes the tag  -> Packagist publishes tbtop/admin via webhook
#   5. creates a GitHub Release with notes rendered by git-cliff (cliff.toml)
#
# Before anything is published it also refuses a version without a
# CHANGELOG.md entry, or a patch bump over a breaking commit (VERSIONING.md).
#
# npm goes BEFORE the tag on purpose: a npm failure then leaves no dangling tag,
# so a re-run stays clean (the tag-exists guard wouldn't block it).
#
# npm publish lives here (not a tag-triggered workflow) because a tag pushed by
# Actions does not trigger other workflows. One button, one run, both packages.
#
# IMPORTANT: this filename (release.yml) is registered as the npm trusted
# publisher on npmjs.com. Renaming it breaks publishing until npmjs.com updates.
#
# Concurrency: only one release run at a time, and the second queues rather
# than cancels. Cancelling mid-run is worse than waiting — a run killed
# between "Publish to npm" and "Create and push tag" leaves a published npm
# package with no tag, so Packagist never sees the release.
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the tag + create the GitHub Release
  id-token: write # OIDC for npm trusted publishing

jobs:
  # Renders the notes in a job without publish rights, so git-cliff and the
  # root devDependencies never run next to the npm OIDC token.
  notes:
    name: CHANGELOG check + release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history + tags: git-cliff renders the notes from the commits
      # since the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # git-cliff, pinned by the root bun.lock.
      - name: Install root tooling
        run: bun install --frozen-lockfile --ignore-scripts

      # The bump PR adds the release to CHANGELOG.md (scripts/changelog.sh).
      - name: Require a CHANGELOG entry
        run: |
          v="$(bun -p "require('./packages/client/package.json').version")"
          if ! grep -q "^## \[$v\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no $v entry — run scripts/changelog.sh in the version-bump PR"
            exit 1
          fi

      # Fails on a breaking commit under a patch bump, before anything publishes.
      - name: Render release notes
        run: scripts/changelog.sh --notes "$RUNNER_TEMP/release-notes.md"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  release:
    name: Tag + publish both packages
    needs: notes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v4

      - name: Require dispatch from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Release must be run from main, not $REF"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Node 22 bundles npm 10.9.x; OIDC publishing needs npm >= 11.5.1.
      # Without this, npm silently skips OIDC and publish fails as a masked E404.
      # Pinned (not @latest): npm 12.0.0 ships a broken publish (MODULE_NOT_FOUND
      # sigstore), which killed the 0.2.11 release run.
      - name: Upgrade npm for OIDC
        run: npm install -g npm@11.18.0

      # prepublishOnly builds dist via tsup, which runs on bun.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Read version
        id: ver
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "resolved version $v"

      # Checked before anything is published: a mismatch found after the
      # client publish would leave the client on npm with no tag.
      - name: Require the same version in packages/node
        working-directory: packages/node
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$TAG" ]; then
            echo "::error::packages/node is $v, the client is $TAG — bump both"
            exit 1
          fi

      # git ls-remote --exit-code returns 0 (ref matched), 2 (remote contacted,
      # no match), or other nonzero codes for real failures (network, auth).
      # Only 2 means "tag is free" — anything else must not be treated as such.
      - name: Fail if tag already exists
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>/dev/null; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo "::error::$TAG already exists — bump the version in package.json first"
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "::error::could not verify $TAG is free (git ls-remote exited $status)"
            exit 1
          fi
          echo "$TAG is free"

      - name: Fetch release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}

      # npm first: if this fails, no tag is pushed, so a re-run stays clean.
      # OIDC is auto-detected; provenance is generated automatically.
      # Skips a version already on npm, so a re-run after a later step failed
      # (e.g. the node package below) does not die here.
      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          v="$(node -p "require('./package.json').version")"
          if npm view "$name@$v" version >/dev/null 2>&1; then
            echo "$name@$v is already on npm, skipping"
          else
            npm publish
          fi

      # @tbtop/admin (node) ships lockstep with the client (version checked
      # above). Published after the client and still before the
      # tag, so a failure leaves no tag.
      - name: Install @tbtop/admin (node)
        working-directory: packages/node
        run: bun install --frozen-lockfile

      - name: Publish @tbtop/admin (node) to npm
        working-directory: packages/node
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "@tbtop/admin@$v" version >/dev/null 2>&1; then
            echo "@tbtop/admin@$v is already on npm, skipping"
          else
            npm publish
          fi

      # Re-check right before tagging: the earlier check ran before npm publish,
      # and a full publication sits in the gap between the two. This can't
      # prevent a duplicate npm publish, but it stops a duplicate tag/release.
      # Same exit-code handling as the early check — after publish is exactly
      # where treating "couldn't verify" as "must be free" is most expensive.
      - name: Fail if tag already exists (re-check)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>/dev/null; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo "::error::$TAG already exists — npm published but the tag step was aborted to avoid a duplicate tag/release"
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "::error::could not verify $TAG is still free (git ls-remote exited $status) — npm published, refusing to guess before tagging"
            exit 1
          fi

      # Pushing the tag lets Packagist publish the PHP package via its webhook.
      # Annotated tag needs a tagger identity — the runner has none by default.
      - name: Create and push tag
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
