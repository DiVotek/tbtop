name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Every file the node tests read. PHP DSL changes reach them through the
          # kitchen-sink fixture (contracts) and the generated docs/ai/api.
          filters: |
            node:
              - "packages/node/**"
              - "apps/node-demo/**"
              - "packages/contracts/**"
              - "packages/client/**"
              - "packages/php/resources/lang/**"
              - "docs/ai/api/**"
              - ".github/workflows/ci.yml"

  php:
    name: PHP (pest + phpstan + pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/php
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: packages/php/vendor
          key: composer-${{ hashFiles('packages/php/composer.json') }}

      - name: Install
        run: composer install --no-interaction --prefer-dist

      - name: PHPStan
        run: composer run analyse

      - name: Pest
        run: vendor/bin/pest

      - name: Contract fixture drift
        run: git diff --exit-code -- ../contracts

  client:
    name: Client (tsc + bun test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    name: Node server (tsc + bun test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test (schema + PHP fixture parity)
        run: bun test

      - name: Lang in sync with the PHP lang files
        run: bun run check:lang

  node-package:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    name: Node package (build, publint, attw, packed install)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build and check the packed package under Node
        run: bun run check:package

  node-workers:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    name: Node server on Cloudflare Workers (workerd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run the core in workerd
        run: bun run check:workers

  lint:
    name: Lint + format (oxlint + biome + pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install root tooling
        run: bun install --frozen-lockfile

      - name: oxlint
        run: bun run lint

      - name: biome (format check)
        run: bun run format:check

      - name: Composer require parity (root vs packages/php)
        run: php scripts/check-composer-require-parity.php

      - name: pint (format check)
        run: |
          cd packages/php
          composer install --no-interaction --prefer-dist
          vendor/bin/pint --test
